spring:
  application:
    name: config-admin

server:
  port: 8090
  servlet:
    session:
      # Never put the session id in URLs (redirects, links), where it leaks into logs and history
      tracking-modes: cookie

config-admin:
  lease-duration: 45s
  evict-after: 10m
  request-timeout: 5s
  # dashboard:
  #   path: /            # e.g. /config-admin to serve the dashboard under a sub-path
  # Each service's config-core.internal.secret, so the admin app can read and change its config:
  # service-secrets:
  #   orders: ${ORDERS_CONFIG_SECRET}
  # default-service-secret: ${CONFIG_CORE_SECRET}
