name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 'verify' runs unit tests (surefire) + integration tests (failsafe, Testcontainers).
      # GitHub-hosted Ubuntu runners have Docker available, so Testcontainers works out of the box.
      - name: Build and test
        run: mvn -B -ntp verify
