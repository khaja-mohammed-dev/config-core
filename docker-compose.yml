# Local single-node MongoDB replica set (change streams REQUIRE a replica set).
# Start:   docker compose up -d
# Connect: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:7.0
    container_name: configstream-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      # Initiates the replica set on first run; no-op afterwards
      test: >
        echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
